# Tool settings only (this is not a packaged project).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]      # so `import aiana` works without installing anything
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["reference_code", "data", "notebooks", "saved_models"]

[tool.ruff.lint]
# Deliberately small: only things that are real bugs (syntax errors, unused or undefined names).
# Style rules (line length, semicolons) are left off so the checker stays quiet and useful.
select = ["E9", "F"]
